# Local development stack. Every published port is bound to the loopback address
# on purpose: Elasticsearch runs here with security disabled and Redis with no
# password, so publishing them on 0.0.0.0 would hand two unauthenticated data
# stores to anything that can reach this machine on the network. Containers talk
# to each other over the compose network by service name, which is unaffected.
services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.17.0
    container_name: search-elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - '127.0.0.1:9200:9200'
    healthcheck:
      test: ['CMD-SHELL', 'curl -s -f http://localhost:9200/_cluster/health || exit 1']
      interval: 10s
      timeout: 5s
      retries: 12
    volumes:
      - es-data:/usr/share/elasticsearch/data

  redis:
    image: redis:7-alpine
    container_name: search-redis
    ports:
      - '127.0.0.1:6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 3s
      retries: 5
    volumes:
      - redis-data:/data

  api:
    build: .
    container_name: search-api
    depends_on:
      elasticsearch:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - NODE_ENV=production
      - PORT=3000
      - ELASTICSEARCH_NODE=http://elasticsearch:9200
      - ELASTICSEARCH_INDEX=products
      - REDIS_URL=redis://redis:6379
      # Authentication defaults to ON and refuses to boot without API_KEYS
      # (design D31), so this has to be stated: without it `docker compose up`
      # dies at startup. Off rather than a key here because a credential
      # committed to this file would be a credential in the repo — a deployment
      # that should require one sets API_KEYS on the host instead.
      - API_AUTH_ENABLED=false
      - METRICS_TOKEN=local-dev
    ports:
      # Loopback: with authentication off above, publishing on 0.0.0.0 would put
      # an unauthenticated API on the local network.
      - '127.0.0.1:3000:3000'

  # One-shot seed job: `docker compose --profile seed run --rm seed`
  seed:
    build: .
    container_name: search-seed
    profiles: ['seed']
    restart: 'no'
    depends_on:
      elasticsearch:
        condition: service_healthy
    environment:
      - NODE_ENV=production
      - ELASTICSEARCH_NODE=http://elasticsearch:9200
      - ELASTICSEARCH_INDEX=products
      - REDIS_URL=redis://redis:6379
      # The seed boots its own Nest context with no HTTP edge, but it validates
      # the same environment, so the same refusal applies to it.
      - API_AUTH_ENABLED=false
      - METRICS_ENABLED=false
    command: ['node', 'dist/seed/seed.command.js']

volumes:
  es-data:
  redis-data:
