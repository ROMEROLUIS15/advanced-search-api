name: Keep alive
on:
  schedule:
    # Why this workflow exists: Render's free instance type spins down after
    # ~15 minutes without inbound traffic, and the cold start that follows costs
    # ~20-25s on the first request (measured 22.5s). Pinging the deployment often
    # enough keeps the live URL in the README answering in ~0.5s at any time.
    # It doubles as a poor-man's uptime monitor: the job fails loudly if the
    # deployment stops answering, which is a signal worth having.
    #
    # Every 10 minutes, not every 15: GitHub's scheduled runs are best-effort and
    # are routinely delayed several minutes under load, so the interval needs
    # headroom against the 15-minute spin-down window.
    #
    # Round the clock since 2026-07-27, when the API gained real consumers.
    # Before that it ran 17 h/day (06:00-23:00 at a UTC-4 offset, ~525 h/month)
    # and the instance was allowed to sleep overnight, which meant whoever
    # called first in the morning paid a ~20 s cold start. With consumers on the
    # other end that is no longer an acceptable trade.
    #
    # The quota arithmetic, which is the reason this line is a decision and not
    # a preference: Render's free tier bills **750 instance-hours per month
    # across the whole workspace**, and staying awake 24/7 costs ~730 of them.
    # That fits — with ~20 h of margin, and only while this is the ONLY free
    # service in the workspace. Adding a second one would put the workspace over
    # its quota and Render suspends services when that happens, so a new free
    # service and this schedule cannot coexist: one of them has to give.
    - cron: '*/10 * * * *'
  workflow_dispatch:

concurrency:
  # A queued ping is worthless once a newer one starts.
  group: keep-alive
  cancel-in-progress: true

permissions:
  # The job checks nothing out and writes nothing back, so read is all the token
  # ever needs.
  contents: read

jobs:
  ping:
    name: Ping the deployment
    runs-on: ubuntu-latest
    # Cold start + ES/Redis probes stay well inside this; the cap only stops a
    # hung request from burning runner minutes.
    timeout-minutes: 5
    env:
      # Static literal, no expression syntax. Point the keep-alive at a different
      # deployment by editing this line.
      TARGET_URL: 'https://advanced-search-api-chet.onrender.com/health'
    steps:
      - name: GET /health
        run: |
          # /health is the right target twice over: it is the same path Render's
          # own health check polls, and it is the one endpoint the rate limiter
          # exempts (the skipIf in presentation/rate-limit/rate-limit.options.ts,
          # design D17), so the keep-alive never eats into a client's budget.
          #
          # --max-time 90: if the instance did manage to spin down, this request
          # is the one paying the cold start. --retry 2 covers curl's transient
          # errors (timeouts and 408/429/500/502/503/504) — enough to ride out an
          # Elasticsearch reconnect, not enough to paint a real outage green,
          # since the explicit check below still fails the job on any non-200.
          http_code=$(curl -sS --max-time 90 --retry 2 --retry-delay 10 \
            -o response.json -w '%{http_code}' "$TARGET_URL")

          echo "HTTP $http_code from $TARGET_URL"
          cat response.json

          if [ "$http_code" != "200" ]; then
            echo "::error::Keep-alive ping failed with HTTP $http_code"
            exit 1
          fi
