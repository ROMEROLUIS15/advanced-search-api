name: Keep alive
on:
  # THE SCHEDULE IS RETIRED (2026-08-20). This job no longer runs on its own;
  # it stays as a manual probe you can fire from the Actions tab to check
  # whether the deployment answers again.
  #
  # Why it was retired, measured rather than assumed: the deployment stopped
  # answering on 2026-08-08 20:39 UTC and stayed dead, so every scheduled run
  # since then failed — 358 of them, ~30 notification emails a day about a
  # single fact already known. Render's edge still completes the TLS handshake
  # and accepts the request, then returns 0 bytes for the full 90 s timeout, on
  # `/`, `/health`, `/health/live` and `/health/ready` alike. `/health/live`
  # calls nothing (no Elasticsearch, no Redis), so its silence is the tell: this
  # is not a dependency outage surfacing as a 503 — no instance is serving at
  # all. Either Render suspended the service or a deploy never satisfied the
  # `healthCheckPath: /health/ready` gate and the router waits on an instance
  # that never turns healthy. Fixing that needs the Render and Elastic Cloud
  # consoles, not this workflow.
  #
  # What the schedule was already worth before that, measured 2026-07-28 over
  # the full run history: GitHub honours a `*/10` cron roughly once an hour,
  # with gaps up to 8h48, and the missed ticks are never created (zero queued or
  # cancelled runs), so no concurrency or workflow setting could fix it. What
  # actually kept the free instance awake was an external UptimeRobot monitor on
  # `/health` every 5 minutes — well inside the ~15-minute spin-down window —
  # which also owned the uptime-alarm role this job could not claim (its runs
  # stayed green while the instance napped ten times a day: the curl below rides
  # out the very cold start it existed to prevent).
  #
  # To bring the schedule back once the deployment is healthy again, restore:
  #     schedule:
  #       - cron: '*/10 * * * *'
  # and remember GitHub auto-disables schedules after 60 days of repo
  # inactivity. The quota arithmetic still decides things: Render's free tier
  # bills **750 instance-hours per month across the whole workspace**, and
  # staying awake 24/7 costs ~730 of them — that fits only while this is the
  # ONLY free service in the workspace, since Render suspends services when a
  # workspace goes over quota.
  workflow_dispatch:

concurrency:
  # A queued ping is worthless once a newer one starts.
  group: keep-alive
  cancel-in-progress: true

permissions:
  # The job checks nothing out and writes nothing back, so read is all the token
  # ever needs.
  contents: read

jobs:
  ping:
    name: Ping the deployment
    runs-on: ubuntu-latest
    # Cold start + ES/Redis probes stay well inside this; the cap only stops a
    # hung request from burning runner minutes.
    timeout-minutes: 5
    env:
      # Static literal, no expression syntax. Point the keep-alive at a different
      # deployment by editing this line.
      TARGET_URL: 'https://advanced-search-api-chet.onrender.com/health'
    steps:
      - name: GET /health
        run: |
          # /health is the right target twice over: it is the same path Render's
          # own health check polls, and it is the one endpoint the rate limiter
          # exempts (the skipIf in presentation/rate-limit/rate-limit.options.ts,
          # design D17), so the keep-alive never eats into a client's budget.
          #
          # --max-time 90: if the instance did manage to spin down, this request
          # is the one paying the cold start. --retry 2 covers curl's transient
          # errors (timeouts and 408/429/500/502/503/504) — enough to ride out an
          # Elasticsearch reconnect, not enough to paint a real outage green,
          # since the explicit check below still fails the job on any non-200.
          http_code=$(curl -sS --max-time 90 --retry 2 --retry-delay 10 \
            -o response.json -w '%{http_code}' "$TARGET_URL")

          echo "HTTP $http_code from $TARGET_URL"
          cat response.json

          if [ "$http_code" != "200" ]; then
            echo "::error::Keep-alive ping failed with HTTP $http_code"
            exit 1
          fi
