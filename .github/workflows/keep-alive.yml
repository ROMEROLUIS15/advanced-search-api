name: Keep alive
on:
  schedule:
    # THIS WORKFLOW IS A BACKSTOP, NOT THE KEEP-ALIVE. Measured 2026-07-28 over
    # the full run history: GitHub honours this */10 schedule roughly once an
    # hour, with gaps up to 8h48 — the ticks are never created (zero queued or
    # cancelled runs), so no concurrency or workflow setting can fix it. A
    # schedule this frequent is simply not something GitHub delivers reliably.
    #
    # What actually keeps Render's free instance awake since 2026-07-28 is an
    # external UptimeRobot monitor hitting /health every 5 minutes — well
    # inside the ~15-minute spin-down window — which also alerts by email on a
    # non-200, taking over the uptime-alarm role this job can no longer claim
    # (its runs stayed green while the instance napped ten times a day: the
    # curl below simply rides out the ~20-25s cold start it exists to prevent).
    #
    # Kept at */10 anyway: whatever GitHub does deliver acts as an independent
    # hourly-ish probe from a second network, and it costs nothing. If it looks
    # dead for a day, remember GitHub auto-disables schedules after 60 days of
    # repo inactivity — check the Actions tab before the cron syntax.
    #
    # The quota arithmetic still decides things: Render's free tier bills
    # **750 instance-hours per month across the whole workspace**, and staying
    # awake 24/7 — now actually delivered by the 5-minute monitor — costs ~730
    # of them. That fits, with ~20 h of margin, and only while this is the ONLY
    # free service in the workspace: a second one would put the workspace over
    # quota, and Render suspends services when that happens.
    - cron: '*/10 * * * *'
  workflow_dispatch:

concurrency:
  # A queued ping is worthless once a newer one starts.
  group: keep-alive
  cancel-in-progress: true

permissions:
  # The job checks nothing out and writes nothing back, so read is all the token
  # ever needs.
  contents: read

jobs:
  ping:
    name: Ping the deployment
    runs-on: ubuntu-latest
    # Cold start + ES/Redis probes stay well inside this; the cap only stops a
    # hung request from burning runner minutes.
    timeout-minutes: 5
    env:
      # Static literal, no expression syntax. Point the keep-alive at a different
      # deployment by editing this line.
      TARGET_URL: 'https://advanced-search-api-chet.onrender.com/health'
    steps:
      - name: GET /health
        run: |
          # /health is the right target twice over: it is the same path Render's
          # own health check polls, and it is the one endpoint the rate limiter
          # exempts (the skipIf in presentation/rate-limit/rate-limit.options.ts,
          # design D17), so the keep-alive never eats into a client's budget.
          #
          # --max-time 90: if the instance did manage to spin down, this request
          # is the one paying the cold start. --retry 2 covers curl's transient
          # errors (timeouts and 408/429/500/502/503/504) — enough to ride out an
          # Elasticsearch reconnect, not enough to paint a real outage green,
          # since the explicit check below still fails the job on any non-200.
          http_code=$(curl -sS --max-time 90 --retry 2 --retry-delay 10 \
            -o response.json -w '%{http_code}' "$TARGET_URL")

          echo "HTTP $http_code from $TARGET_URL"
          cat response.json

          if [ "$http_code" != "200" ]; then
            echo "::error::Keep-alive ping failed with HTTP $http_code"
            exit 1
          fi
