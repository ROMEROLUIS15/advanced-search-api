name: Security

# Three of the security layers that need CI runtime:
#   - secrets: gitleaks over the full git history (the SAST/SCA layers are
#     codeql.yml and dependabot.yml).
#   - dast:    OWASP ZAP baseline against the running API.
#   - image:   Trivy over the built runtime image, plus its SBOM. CodeQL reads the
#              source and Dependabot reads package.json; neither looks at what is
#              actually shipped — the Alpine packages, the pruned node_modules, the
#              base image layers. This job is the only one that does.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '43 3 * * 1'
  workflow_dispatch:

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: '26'

jobs:
  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history so every commit is scanned, not just the tip. Measured
          # clean over 51 commits at setup time; --exit-code=1 keeps it that way.
          fetch-depth: 0

      - name: gitleaks
        run: |
          # Pinned by digest, not by `:latest`: a scanner that runs with the whole
          # repository mounted is the last place to accept a tag someone else can
          # move. The version tag is kept beside it for readability only — the
          # digest is what docker resolves. Dependabot does NOT track images named
          # in a `run:` step (it reads the Dockerfile and, inside workflows, only
          # `container:`/`services:`), so this digest is refreshed by hand:
          #   docker manifest inspect zricethezav/gitleaks:v8.30.1
          docker run --rm -v "${{ github.workspace }}:/repo" \
            zricethezav/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f detect \
            --source=/repo --redact --no-banner --exit-code=1

  dast:
    name: DAST (OWASP ZAP api-scan)
    runs-on: ubuntu-latest
    env:
      NODE_ENV: test
      ELASTICSEARCH_NODE: http://localhost:9200
      ELASTICSEARCH_INDEX: products
      REDIS_URL: redis://localhost:6379
      PORT: '3000'
      # ZAP fires many requests from one IP; with the limiter on it would scan
      # its own 429s. The limiter has its own correctness run
      # (loadtest/rate-limit.js), so DAST scans the endpoints with it off.
      RATE_LIMIT_ENABLED: 'false'
      # Same reasoning for authentication: ZAP is here to fuzz the application
      # surface, and a wall of 401s would hide it. The gate itself is covered by
      # test/api-auth.e2e-spec.ts (design D31).
      API_AUTH_ENABLED: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      # The repo's own compose file, so CI and the local workflow cannot drift.
      - name: Start Elasticsearch and Redis
        run: docker compose up -d --wait elasticsearch redis

      - name: Build
        run: npm run build

      # seed:prod runs from dist/ (no ts-node in this path), matching Docker/Render.
      - name: Seed the index
        run: npm run seed:prod

      - name: Start the API
        run: |
          node dist/main.js &
          echo "$!" > api.pid

      - name: Wait for the API
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3000/health >/dev/null; then
              echo "API ready after ~$((i * 2))s"; exit 0
            fi
            sleep 2
          done
          echo "API did not become ready"; exit 1

      - name: OWASP ZAP API scan (OpenAPI)
        run: |
          mkdir -p zap-out && cp .zap/rules.tsv zap-out/rules.tsv && chmod -R 777 zap-out
          # api-scan imports the OpenAPI contract at /docs-json and scans each
          # endpoint with its parameters (e.g. the `q` param of /search) — the
          # passive baseline's spider cannot discover JSON API endpoints, so it
          # only ever reached /. --network host: reach the API on the runner's
          # localhost:3000. -f openapi: the target is an OpenAPI definition.
          # -c rules.tsv: design-decision false positives (.zap/rules.tsv) are set
          # to IGNORE there so they don't count. Blocking (no -I): a WARN or FAIL
          # fails the job. Measured 0 WARN / 0 FAIL over 128 URLs, so a new finding
          # is either a real regression or a false positive to add to rules.tsv.
          # Pinned by digest for the reason given on the gitleaks step, and
          # refreshed the same way — by hand, since Dependabot cannot see it:
          #   docker manifest inspect ghcr.io/zaproxy/zaproxy:2.17.0
          # `:stable` resolved to exactly this digest when it was pinned, so the
          # scan behaviour is unchanged; only its mutability is.
          docker run --rm --network host \
            -v "${{ github.workspace }}/zap-out:/zap/wrk:rw" \
            ghcr.io/zaproxy/zaproxy:2.17.0@sha256:8d387b1a63e3425beef4846e39719f5af2a787753af2d8b6558c6257d7a577a2 \
            zap-api-scan.py -t http://localhost:3000/docs-json -f openapi \
            -c rules.tsv -r report.html -w report.md

      - name: Upload ZAP report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: zap-api-scan-report
          path: zap-out/
          if-no-files-found: warn

      - name: Stop the API
        if: always()
        run: '[ -f api.pid ] && kill "$(cat api.pid)" 2>/dev/null || true'

  image:
    name: Image scan + SBOM (Trivy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Also the only job in the whole pipeline that builds the Dockerfile.
      # `quality` and `production-shape` build with npm and `integration` only
      # composes Elasticsearch and Redis, so before this job a broken Dockerfile
      # surfaced at the Render deploy and nowhere earlier.
      - name: Build the runtime image
        run: docker build -t advanced-search-api:ci .

      # Blocking, like the ZAP scan: a HIGH or CRITICAL with a fix available is a
      # base image or dependency that must move, and the digest pin in the
      # Dockerfile means it will not move on its own.
      # `ignore-unfixed` is what keeps that gate honest rather than noisy — an
      # unfixed CVE has no action attached, so failing on it would only teach
      # people to ignore a red job.
      - name: Scan the image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: advanced-search-api:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          format: table

      # Separate invocation on purpose: this one must produce an inventory even
      # when the scan above failed, so `if: always()` and no exit code.
      - name: Generate the SBOM
        if: always()
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: advanced-search-api:ci
          scan-type: image
          format: cyclonedx
          output: sbom.cdx.json

      - name: Upload the SBOM
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom-cyclonedx
          path: sbom.cdx.json
          if-no-files-found: warn

      - name: Container logs (on failure)
        if: failure()
        run: docker compose logs --tail=100 elasticsearch redis
