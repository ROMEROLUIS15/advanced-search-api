# Dependabot is the SCA (software composition analysis) layer of the security
# pipeline: it opens PRs for vulnerable/outdated dependencies. It complements the
# runtime scanners in security.yml (secrets, DAST) and codeql.yml (SAST).
#   - npm            -> the application and its transitive dependencies
#   - github-actions -> keep the pinned action versions in the workflows current
#   - docker         -> keep the Dockerfile runtime base image (node:*-alpine) patched
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      # One PR for the routine minor/patch bumps keeps the noise down; majors
      # still arrive as individual PRs so a breaking change is reviewed on its own.
      npm-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
