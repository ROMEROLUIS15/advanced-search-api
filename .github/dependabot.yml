# Dependabot is the SCA (software composition analysis) layer of the security
# pipeline: it opens PRs for vulnerable/outdated dependencies. It complements the
# runtime scanners in security.yml (secrets, DAST) and codeql.yml (SAST).
#   - npm            -> the application and its transitive dependencies
#   - github-actions -> keep the pinned action versions in the workflows current
#   - docker         -> keep the Dockerfile runtime base image (node:*-alpine) patched
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      # One PR for the routine minor/patch bumps keeps the noise down; majors
      # still arrive as individual PRs so a breaking change is reviewed on its own.
      npm-minor-patch:
        update-types: [minor, patch]
    ignore:
      # The Elasticsearch client is pinned to 8.x to match the 8.17 server
      # (audit F5 / CLAUDE.md). A 9.x client against an 8.x cluster is
      # unsupported, so major bumps here are a deliberate no — don't reopen them.
      - dependency-name: '@elastic/elasticsearch'
        update-types: ['version-update:semver-major']
      # TypeScript stays on 5.x: TS 7.0 lacks the programmatic compiler API the
      # Nest CLI / ts-jest / typescript-eslint need (returns in 7.1), and TS 6
      # deprecates baseUrl + moduleResolution=node10 (migration touches
      # tsc-alias / tsconfig-paths). Revisit when 7.1 ships.
      - dependency-name: 'typescript'
        update-types: ['version-update:semver-major']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
