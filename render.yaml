# Render Blueprint (https://render.com/docs/blueprint-spec).
#
# Deploys the API from the repo's multi-stage Dockerfile. The service is
# stateless: Elasticsearch and Redis are managed externally (Elastic Cloud
# Serverless + Upstash), so only environment values change between local and
# cloud — the same code path runs in both (design D12).
#
# Secrets are declared with `sync: false`: Render prompts for them when the
# blueprint is applied and stores them on the service, never in this repo.
services:
  - type: web
    name: advanced-search-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    # Closest free region to the Elastic Cloud project (us-central1).
    region: ohio
    branch: main
    autoDeploy: true
    # Render waits for this to return 200 before routing traffic, and reports 503
    # while Elasticsearch is unreachable or its configured index is missing — so
    # a deploy against an unseeded cluster fails instead of serving errors.
    #
    # `/health/ready`, not `/health`: this is polled every ~4.3 s (measured), and
    # the full report also pings Redis, whose result can never change the verdict
    # because it is non-critical. That discarded ping was ~605k Upstash commands
    # a month against a 500k free tier. Readiness runs the critical probes only
    # (design D39). `/health` still reports everything for humans and the uptime
    # monitor.
    healthCheckPath: /health/ready
    envVars:
      - key: NODE_ENV
        value: production
      # Pinned so the port matches the Dockerfile's EXPOSE/HEALTHCHECK.
      - key: PORT
        value: 3000
      - key: ELASTICSEARCH_INDEX
        value: products
      # Three proxy hops in front of the app on Render: the platform's internal
      # load balancer, Cloudflare, and the edge. Confirmed by inspecting the live
      # X-Forwarded-For — the real client is the leftmost of three entries, and
      # the rightmost (Render-internal) rotates per request. Trusting 3 hops makes
      # the rate limiter read the stable real client IP; trusting fewer buckets a
      # single user across rotating internal addresses and weakens the limit
      # (design D16). Counting from the right also means a client cannot prepend a
      # forged X-Forwarded-For to escape its bucket.
      - key: TRUST_PROXY_HOPS
        value: 3
      # ── Prompted on apply ──────────────────────────────────────
      # https://<project>.es.<region>.gcp.elastic.cloud:443
      - key: ELASTICSEARCH_NODE
        sync: false
      # base64 API key from the Elastic Cloud project
      - key: ELASTICSEARCH_API_KEY
        sync: false
      # rediss://default:<password>@<host>.upstash.io:6379
      - key: REDIS_URL
        sync: false
      # Comma-separated browser origins that may call this API. Empty means
      # same-origin only in production, which is the right setting while every
      # caller is server-side or a tool; it must list the real origins the day a
      # browser client ships, and must never become "*".
      - key: CORS_ORIGINS
        sync: false
      # ── API client authentication (design D30–D34) ────────────
      # Defaults to true in code, stated here so it is visible in the
      # blueprint. Enabling it without API_KEYS fails startup by design.
      - key: API_AUTH_ENABLED
        value: true
      # Comma-separated keys, prompted on apply and stored on the service.
      # Several are valid at once so one can be rotated without downtime.
      - key: API_KEYS
        sync: false
      # Bearer token for /metrics. Set on the service, never in this file: the
      # endpoint discloses route names, volumes, error rates and cache behaviour.
      - key: METRICS_TOKEN
        sync: false
      # ── Observability (design D21–D25) ─────────────────────────
      # OTLP endpoint and credentials for trace export. Unset means no tracing
      # SDK is started at all, so a fresh environment boots without them.
      - key: OTEL_EXPORTER_OTLP_ENDPOINT
        sync: false
      - key: OTEL_EXPORTER_OTLP_HEADERS
        sync: false
      - key: OTEL_SERVICE_NAME
        value: advanced-search-api
      # 1.0 while traffic is low: head sampling at 10% would mean the slow
      # request someone reports was probably never recorded. Revisit around
      # ~7.5 req/s sustained — see docs/OBSERVABILITY-2026-07-27.md.
      - key: OTEL_TRACES_SAMPLER_RATIO
        value: 1
      # ── Telemetry shipping (design D35–D38) ────────────────────
      # Every variable below must be declared here even though the service
      # already has it. Both pipelines are inert when unconfigured — no
      # exporter, no worker, no timer, and no complaint — which is what keeps
      # CI and the e2e suites backend-free (D38) and also what makes an
      # omission here silent: applying this blueprint to a fresh environment
      # without them yields a service that ships no logs and no metrics while
      # looking perfectly healthy. Read the boot line to know which pipelines
      # are actually live; it names all three.
      #
      # Metric export is opt-in on its own flag rather than following the OTLP
      # endpoint, because configuring *tracing* must never start a metrics
      # pipeline by accident — it silently did until 1452e7b.
      - key: OTEL_METRICS_EXPORT_ENABLED
        value: true
      # Loki, for log shipping. Prompted rather than committed, matching how
      # the OTLP endpoint above is handled: these identify the Grafana tenant.
      # The username is the Loki datasource's numeric user id, which is NOT
      # the one in the OTLP gateway credential — each signal has its own.
      # Username and password must be set together or not at all; the schema
      # rejects half a credential, because Loki would answer 401 to every
      # batch and shipping is best-effort, so the failure would be invisible.
      #
      # LOKI_PASSWORD is the same Grafana Cloud token used inside
      # OTEL_EXPORTER_OTLP_HEADERS above: rotating it means editing BOTH, or
      # one pipeline stops shipping in silence.
      - key: LOKI_URL
        sync: false
      - key: LOKI_USERNAME
        sync: false
      - key: LOKI_PASSWORD
        sync: false
